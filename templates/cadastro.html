<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckfy - Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../static/css/variaveis.css">
    <link rel="stylesheet" href="../static/css/cadastro.css">
</head>
<body>


    <h1><span class="duck">Faça seu cadastro!</span></h1>

    <form method="POST" action="/cadastro/usuario">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <br><br>

        <label for="confirma_senha">Repita sua Senha</label>
        <input type="password" id="confirma_senha" name="confirma_senha" required>


        <div class="botoes">
            <button href="/login" type="button">Cancelar</button>
            <button type="submit">Cadastrar-se</button>
        </div>

            <div class="container__error">
                {% with mensagens = get_flashed_messages()%}
                {% for mensagem in mensagens %}
                <p class="text-error">{{mensagem}}</p>
                {%endfor%}
                {%endwith%}
            </div>
        

    </form>
    
</body>
</html>
