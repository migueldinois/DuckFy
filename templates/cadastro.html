<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DuckFy - Cadastro</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- arquivos css -->
    <link rel="stylesheet" href="../static/css/variaveis.css">
    <link rel="stylesheet" href="../static/css/cadastro.css">
</head>

<body>

    <main class="cadastro">

        <!-- conteúdo do cadastro -->
        <section class="cadastro-conteudo">

            <header class="cadastro-topo">
                <h1>Crie sua conta!</h1>
                <p>Faça seu cadastro e comece a organizar suas finanças com a DuckFy.</p>
            </header>

            <form class="cadastro-form" method="POST" action="/cadastro/usuario">

                <!-- email -->
                <div class="campo">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- nome completo -->
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- senha -->
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <!-- confirmação da senha -->
                <div class="campo">
                    <label for="confirma_senha">Confirme sua senha</label>
                    <input
                        type="password"
                        id="confirma_senha"
                        name="confirma_senha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <!-- botões -->
                <div class="botoes">
                    <a href="/login" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-cadastrar">Cadastrar-se</button>
                </div>

                <!-- mensagens do flask -->
                <div class="container__error">
                    {% with mensagens = get_flashed_messages() %}
                        {% for mensagem in mensagens %}
                            <p class="text-error">{{ mensagem }}</p>
                        {% endfor %}
                    {% endwith %}
                </div>

                <p class="cadastro-login">
                    Já possui uma conta?
                    <a href="/login">Faça login</a>
                </p>

            </form>

        </section>

    </main>

</body>
</html>
