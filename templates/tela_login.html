<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duckfy - Login</title>

    <!-- conecta o CSS -->
    <link rel="stylesheet" href="static/css/variables.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body>

    <!-- classe de login -->
    <main class="login">

        <!-- topo da tela -->
        <section class="login-topo">
            <h1>Bem Vindo(a) de Volta!</h1>

            <p>Faça login na sua conta da Duckfy</p>
        </section>


        <!-- conteúdo do login -->
        <section class="login-conteudo">

            <form action="/login/usuario" method="POST">

                <!-- campo de e-mail -->
                <div class="campo">
                    <label for="email">E-mail:</label>
                    <!-- ADICIONADO: name="email" -->
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>


                <!-- campo de senha -->
                <div class="campo">
                    <div class="senha-label">
                        <label for="senha">Senha:</label>
                    </div>
                    <!-- ADICIONADO: name="senha" -->
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>


                <!-- botão de entrar -->
                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

            </form>



            <div class="container__error">
                {% with mensagens = get_flashed_messages()%}
                {% for mensagem in mensagens %}
                <p class="text-error">{{mensagem}}</p>
                {%endfor%}
                {%endwith%}
            </div>


            <!-- separador -->
            <div class="separador">
                <span>ou</span>
            </div>


            <!-- cadastro -->
            <div class="cadastro">

                <div>
                    <a href="/cadastro">Não tem uma conta?</a>
                </div>

                <a href="#">Esqueci Minha Senha</a>

            </div>

        </section>

    </main>

</body>

</html>
