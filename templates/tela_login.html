<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duckfy - Login</title>

    <!-- conecta o CSS -->
     <link rel="stylesheet" href="static/css/variables.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body>

    <!-- classe de login -->
    <main class="login">

        <!-- topo da tela -->
        <section class="login-topo">
            <h1>Bem Vindo(a) de Volta!</h1>

            <p>Faça login na sua conta da Duckfy</p>
        </section>


        <!-- conteúdo do login -->
        <section class="login-conteudo">

            <form>

                <!-- campo de e-mail -->
                <div class="campo">
                    <label for="email">E-mail:</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>


                <!-- campo de senha -->
                <div class="campo">

                    <div class="senha-label">
                        <label for="senha">Senha:</label>
                    </div>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >
                </div>


                <!-- botão de entrar -->
                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

            </form>


            <!-- separador -->
            <div class="separador">
                <span>ou</span>
            </div>


            <!-- cadastro -->
            <div class="cadastro">

                <div>
                    <a href="#">Não tem uma conta?</a>
                </div>

                <a href="#">Esqueci Minha Senha</a>

            </div>

        </section>

    </main>

</body>

</html>
