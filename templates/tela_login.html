
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- adapta a página para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- define o título da página -->
    <title>Duckfy - Login</title>

    <!-- aplica o tema salvo antes de carregar o css -->
    <script src="{{ url_for('static', filename='js/tema-inicial.js') }}"></script>

    <!-- conecta os arquivos css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <!-- importa os ícones flaticon -->
    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
</head>

<body>

    <!-- área usada para desenhar as partículas do fundo -->
    <canvas id="particulas-fundo" aria-hidden="true"></canvas>

    <!-- conteúdo principal da página de login -->
    <main class="login">

        <!-- cabeçalho com logo e botão de tema -->
        <header class="login-cabecalho">

            <!-- logo que direciona para a página inicial -->
            <a href="/" class="login-logo" aria-label="DuckFy - Página inicial">
                <img
                    src="{{ url_for('static', filename='img/logo_escura.png') }}"
                    data-logo-claro="{{ url_for('static', filename='img/logo_clara.png') }}"
                    data-logo-escuro="{{ url_for('static', filename='img/logo_escura.png') }}"
                    alt="Logo DuckFy"
                    class="logo-imagem">
            </a>

            <!-- botão para alternar entre os temas -->
            <nav class="login-opcoes">
                <button
                    type="button"
                    id="btn-tema"
                    aria-label="Ativar tema claro"
                    title="Ativar tema claro">
                    <i class="fi fi-sr-contrast" aria-hidden="true"></i>
                </button>
            </nav>

        </header>
        
        <!-- área que contém o formulário de login -->
        <section class="login-conteudo">
            <div class="login-formulario">

                <!-- título e descrição do login -->
                <section class="login-topo">
                    <h1>Que bom ter você aqui!</h1>
                    <p>Entre na sua conta e acompanhe sua vida financeira.</p>
                </section>

                <!-- envia os dados de login para o servidor -->
                <form action="/login/usuario" method="POST">

                    <!-- campo para informar o e-mail -->
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required>
                    </div>

                    <!-- campo para informar a senha -->
                    <div class="campo">
                        <div class="senha-label">
                            <label for="senha">Senha:</label>
                        </div>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>
                    </div>

                    <!-- envia o formulário -->
                    <button type="submit" class="btn-entrar">
                        Entrar
                    </button>

                </form>

                {% include 'components/sweetalert_messages.html' %}

                <!-- separa visualmente as opções de acesso -->
                <div class="separador">
                    <span>ou</span>
                </div>

                <!-- direciona para a criação de uma conta -->
                <div class="cadastro">
                    <span>Não tem uma conta?</span>
                    <a href="/cadastro">Criar conta</a>
                </div>

                <!-- direciona para a recuperação de senha -->
                <a href="/redefinir" class="login-link-acesso">
                    Esqueci minha senha
                </a>

            </div>
        </section>

    </main>

    <!-- conecta o javascript da página -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/sweetalert-messages.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
