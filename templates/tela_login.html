
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duckfy - Login</title>

    <!-- conecta os estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <!-- tela de login -->
    <main class="login">

        <!-- cabeçalho -->
        <header class="login-cabecalho">

            <!-- logo -->
            <a href="/" class="login-logo">
                <span>Duckfy</span>
            </a>

            <!-- opções do cabeçalho -->
            <nav class="login-opcoes">

                <a href="" aria-label="Termos de uso">
                    Termos
                </a>

                <a href="#" aria-label="Ajuda">
                    Ajuda
                </a>

                <button type="button" id="btn-tema">
                     Tema claro
                </button>

            </nav>

        </header>

        <!-- cartão de login -->
        <section class="login-conteudo">

            <!-- lado do formulário -->
            <div class="login-formulario">

                <!-- título -->
                <section class="login-topo">
                    <h1>Bem-vindo(a) de volta!</h1>
                    <p>Faça login na sua conta da Duckfy</p>
                </section>

                <!-- formulário -->
                <form action="/login/usuario" method="POST">

                    <!-- campo de e-mail -->
                    <div class="campo">
                        <label for="email">E-mail:</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- campo de senha -->
                    <div class="campo">

                        <div class="senha-label">
                            <label for="senha">Senha:</label>
                        </div>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <!-- botão de entrar -->
                    <button type="submit" class="btn-entrar">
                        Entrar
                    </button>

                </form>

                <!-- mensagens do flask -->
                <div class="container__error">
                    {% with mensagens = get_flashed_messages() %}
                        {% for mensagem in mensagens %}
                            <p class="text-error">{{ mensagem }}</p>
                        {% endfor %}
                    {% endwith %}
                </div>

                <!-- separador -->
                <div class="separador">
                    <span>ou</span>
                </div>

                <!-- cadastro e recuperação -->
                <div class="cadastro">
                    <span>Não tem uma conta?</span>
                    <a href="/cadastro">Criar conta</a>
                </div>

                <a href="#" class="login-link-acesso">
                    Esqueci minha senha
                </a>

            </div>

            <!-- imagem lateral -->
            <div class="login-imagem">
                <img
                    src="{{ url_for('static', filename='static/img/duckfy_logo.jpg') }}"
                    alt="duckfy_logo"
                >
            </div>

        </section>

    </main>

    <!-- alterna o tema -->
    <script>
        const botaoTema = document.getElementById("btn-tema");

        botaoTema.addEventListener("click", function () {
            document.body.classList.toggle("tema-claro");

            const temaClaro = document.body.classList.contains("tema-claro");

            botaoTema.textContent = temaClaro
                ? " Tema escuro"
                : " Tema claro";

            botaoTema.setAttribute(
                "aria-label",
                temaClaro ? "Ativar tema escuro" : "Ativar tema claro"
            );
        });
    </script>

</body>

</html>
