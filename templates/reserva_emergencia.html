<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Emergência</title>

  <!-- Bootstrap 5 CSS e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos da aplicação -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reserva_emergencia.css">
</head>
<body id="page-reserva" class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <!-- Card do App Finanças -->
  <main class="reserva-card w-100 p-4 rounded-4 shadow-lg">

    <!-- Header com Botão Voltar -->
    <header class="d-flex align-items-center mb-4">
      <button type="button" class="btn-voltar border-0 bg-transparent text-white p-0 me-3 fs-5" aria-label="Voltar">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="h5 mb-0 fw-semibold text-white">Reserva de Emergência</h1>
    </header>

    <!-- Banner do Progresso / Meta -->
    <section class="reserva-status-box p-3 rounded-4 mb-4">
      <div class="d-flex justify-content-between align-items-baseline mb-2">
        <span class="status-label">Guardado</span>
        <span class="status-porcentagem fw-bold">77%</span>
      </div>

      <!-- Barra de Progresso Customizada -->
      <div class="progress progress-reserva rounded-pill mb-2">
        <div 
          class="progress-bar bar-progresso rounded-pill d-flex align-items-center px-3 fw-bold fs-6" 
          role="progressbar" 
          style="width: 77%;" 
          aria-valuenow="2309" 
          aria-valuemin="0" 
          aria-valuemax="3000">
          R$ 2.309,00
        </div>
      </div>

      <!-- Detalhe do Valor Meta -->
      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="text-muted fs-7">Meta Total</span>
        <span class="valor-meta fw-semibold">R$ 3.000,00</span>
      </div>
    </section>

    <!-- Botões de Ação Principal -->
    <section class="d-flex flex-column gap-3">
      <button type="button" class="btn btn-acao btn-guardar py-3 rounded-3 fw-semibold">
        <i class="bi bi-plus-circle me-2"></i>Guardar Dinheiro
      </button>
      <button type="button" class="btn btn-acao btn-retirar py-3 rounded-3 fw-semibold">
        <i class="bi bi-dash-circle me-2"></i>Retirar Dinheiro
      </button>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
