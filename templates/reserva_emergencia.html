<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Emergência</title>

  <!-- Bootstrap 5 CSS e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos da aplicação -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reserva_emergencia.css">
</head>
<body id="page-reserva" class="py-4">

  <!-- Container principal limitado na mesma largura máxima do dashboard -->
  <main class="container style-reserva-container">
    
    <!-- Header com Botão Voltar e Título -->
    <header class="d-flex align-items-center mb-4">
      <button type="button" class="btn-voltar border-0 bg-transparent text-white p-0 me-3 fs-4" aria-label="Voltar">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="h4 mb-0 fw-semibold text-white">Reserva de Emergência</h1>
    </header>

    <!-- Banner do Progresso em Destaque (Card Grande no Topo) -->
    <section class="reserva-card p-4 rounded-4 shadow-lg mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="status-label fs-5 fw-medium">Guardado</span>
        <span class="status-porcentagem fw-bold fs-3 text-success">77%</span>
      </div>

      <!-- Barra de Progresso Customizada bem Alta/Grande -->
      <div class="progress progress-reserva rounded-pill mb-3" style="height: 48px;">
        <div class="progress-bar bar-progresso rounded-pill d-flex align-items-center justify-content-between px-4 fw-bold fs-5"
             role="progressbar" 
             style="width: 77%;" 
             aria-valuenow="2309" 
             aria-valuemin="0" 
             aria-valuemax="3000">
          <span>R$ 2.309,00</span>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-2">
        <span class="text-white-50 fs-6">Meta Total</span>
        <span class="valor-meta fw-semibold fs-5 text-white">R$ 3.000,00</span>
      </div>
    </section>

    <!-- Seção de Ações / Atalhos ocupando o espaço inferior (em 2 colunas no desktop) -->
    <section class="row g-3">
      <div class="col-12 col-md-6">
        <button type="button" class="btn btn-acao btn-guardar py-3 w-100 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2 fs-5">
          <i class="bi bi-plus-circle fs-4"></i> Guardar Dinheiro
        </button>
      </div>
      <div class="col-12 col-md-6">
        <button type="button" class="btn btn-acao btn-retirar py-3 w-100 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2 fs-5">
          <i class="bi bi-dash-circle fs-4"></i> Retirar Dinheiro
        </button>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
