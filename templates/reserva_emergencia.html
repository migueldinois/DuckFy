<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Emergência</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reserva_emergencia.css">
</head>
<body id="page-reserva" class="py-4">


  <main class="container style-reserva-container">


    <header class="d-flex align-items-center mb-3">
      <button type="button" class="btn-voltar border-0 bg-transparent text-white p-0 me-3 fs-4" aria-label="Voltar">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="h4 mb-0 fw-semibold text-white">Reserva de Emergência</h1>
    </header>

 
    <div class="reserva-card-wrapper p-4 p-md-5 rounded-4 shadow-lg d-flex flex-column justify-content-between">
      
      <div>

        <section class="reserva-status-box p-4 rounded-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="status-label fs-5 fw-medium">Guardado</span>
            <span class="status-porcentagem fw-bold fs-3">77%</span>
          </div>


          <div class="progress progress-reserva rounded-pill mb-3">
            <div class="progress-bar bar-progresso rounded-pill d-flex align-items-center px-4 fw-bold fs-5"
                 role="progressbar" 
                 style="width: 77%;" 
                 aria-valuenow="2309" 
                 aria-valuemin="0" 
                 aria-valuemax="3000">
              R$ 2.309,00
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <span class="fs-6 text-muted">Meta Total</span>
            <span class="valor-meta fw-semibold fs-5">R$ 3.000,00</span>
          </div>
        </section>


        <section class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <button type="button" class="btn btn-acao btn-guardar py-3 w-100 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2 fs-5">
              <i class="bi bi-plus-circle fs-4"></i> Guardar Dinheiro
            </button>
          </div>
          <div class="col-12 col-md-6">
            <button type="button" class="btn btn-acao btn-retirar py-3 w-100 rounded-3 fw-semibold d-flex align-items-center justify-content-center gap-2 fs-5">
              <i class="bi bi-dash-circle fs-4"></i> Retirar Dinheiro
            </button>
          </div>
        </section>
      </div>


      <section class="reserva-historico-box p-4 rounded-4">
        <h2 class="h6 text-white mb-3 fw-semibold">Movimentações da Reserva</h2>
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary border-opacity-25">
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-arrow-down-circle-fill text-success fs-4"></i>
            <div>
              <p class="mb-0 text-white fw-medium">Depósito realizado</p>
              <small class="text-muted">Hoje às 14:30</small>
            </div>
          </div>
          <span class="text-success fw-bold">+ R$ 300,00</span>
        </div>
      </section>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
