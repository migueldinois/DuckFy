<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Emergência</title>

  <!-- 1. Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (Seta de Voltar) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- 2. Arquivos CSS de Estilo -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reserva_emergencia.css">
</head>
<body id="page-reserva" class="d-flex justify-content-center align-items-start py-5">

  <!-- Container Mobile Centralizado -->
  <main class="container d-flex flex-column align-items-center" style="max-width: 380px;">

    <!-- Cabeçalho (Botão Voltar + Título) -->
    <header class="w-100 d-flex align-items-center mb-5">
      <button type="button" class="btn text-white p-0 me-3 fs-5" aria-label="Voltar">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="h5 mb-0 fw-normal">Reserva de Emergência</h1>
    </header>

    <!-- Seção da Barra de Progresso do Objetivo -->
    <section class="w-100 mb-5 px-2">
      <!-- Container da Barra -->
      <div class="progress progress-reserva position-relative rounded-3">
        <div 
          class="progress-bar bar-progresso rounded-3 d-flex align-items-center justify-content-start px-2 fw-medium fs-6" 
          role="progressbar" 
          style="width: 77%;" 
          aria-valuenow="2309" 
          aria-valuemin="0" 
          aria-valuemax="3000">
          R$2.309
        </div>
      </div>
      
      <!-- Valor Meta (Abaixo à Direita) -->
      <div class="text-end mt-1">
        <span class="valor-meta fw-normal">R$3.000,00</span>
      </div>
    </section>

    <!-- Ações (Botões Guardar e Retirar) -->
    <section class="w-100 d-flex flex-column align-items-center gap-3 mt-4">
      <button type="button" class="btn btn-acao rounded-3 py-2 fw-medium">
        Guardar
      </button>
      <button type="button" class="btn btn-acao rounded-3 py-2 fw-medium">
        Retirar
      </button>
    </section>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
