{% extends 'layout.html' %}

{% block title %}Dashboard Financeiro - DuckFy{% endblock %}

{% block content %}

    <div class="app-container d-flex flex-column justify-content-between">

        <!-- HEADER -->
        <header class="header mb-4 pt-2">
            <div class="d-flex align-items-center">
                <a href="#" class="text-white text-decoration-none fs-4 me-3" aria-label="Voltar">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h3 mb-0 fw-bold text-white">Extrato</h1>
            </div>
        </header>

        <main class="flex-grow-1 d-flex flex-column">

            <div class="filter-tabs d-flex justify-content-start gap-4 text-uppercase mb-4 px-2">
                <a href="/extrato?tipo=tudo"
                    class="tab-btn text-decoration-none {% if tipo_ativo == 'tudo' %}active{% endif %}">
                    TUDO
                </a>

                <a href="/extrato?tipo=saida"
                    class="tab-btn text-decoration-none {% if tipo_ativo == 'saida' %}active{% endif %}">
                    SAÍDA
                </a>

                <a href="/extrato?tipo=entrada"
                    class="tab-btn text-decoration-none {% if tipo_ativo == 'entrada' %}active{% endif %}">
                    ENTRADA
                </a>
            </div>

            <div class="timeline-container flex-grow-1 mb-3">

                <div class="timeline-item">
                    <div class="icon-box entrada">
                        <i class="bi bi-cart"></i>
                    </div>
                    <div class="info">
                        <div class="date-time">
                            <span class="time">09:10</span>
                            <span class="date">10/12/2026</span>
                        </div>
                        <div class="description">Transferência</div>
                    </div>
                    <div class="amount positive">+R$ 199</div>
                </div>

                <div class="timeline-item">
                    <div class="icon-box saida">
                        <i class="bi bi-cart"></i>
                    </div>
                    <div class="info">
                        <div class="date-time">
                            <span class="time">12:51</span>
                            <span class="date">01/02/2026</span>
                        </div>
                        <div class="description">Transferência</div>
                    </div>
                    <div class="amount negative">-R$ 19,99</div>
                </div>

                <div class="timeline-item">
                    <div class="icon-box saida">
                        <i class="bi bi-cart"></i>
                    </div>
                    <div class="info">
                        <div class="date-time">
                            <span class="time">16:20</span>
                            <span class="date">01/02/2026</span>
                        </div>
                        <div class="description">Transferência</div>
                    </div>
                    <div class="amount negative">-R$ 1.000</div>
                </div>

            </div>
        </main>

    </div>

{% endblock %}
