<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Patrimõnio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (para ícone de seta, lápis, etc) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/static/css/variables.css">

    <style>

    </style>

</head>

<body>

    <main class="app-container d-flex flex-column justify-content-between p-3">

        <header class="header">

            <a href="" aria-label="Voltar"></a>
            <h1>Simulador de Investimentos</h1>

            <form class="" id="form-simulador">
                <div class="row g-3">
                    <div class="col-6">

                            <label class="form-label small fw-bold">Aporte Inicial (R$)</label>
                            <input type="number" id="aporte-inicial" name="aporte_inicial" step="0.01" placeholder="0,00"
                                required>
                    </div>
                </div>

                <div class="row g-3"></div>

                    <div input-group>
                        <label class="form-label small fw-bold">Aporte Mensal (R$)</label>
                        <input type="number" id="aporte-inicial" name="aporte_inicial" step="0.01" placeholder="0,00"
                            required>"form-label 
                    </div>

                <div class="row g-3"></div>
            </form>

        </header>

        <main class="card-cinza rouded-4 p-3 my-3 flex-grow-1 d-flex flez-column">

            <section class="d-flex justify-content-between align-items-center mb-3">

                <div class="d-flex gap-2">
                    <button type="button" class="btn-periodo">5 anos</button>
                    <button type="button" class="btn-periodo">10 anos</button>
                    <button type="button" class="btn-edit" id="btn-editar-periodo" title="Editar Período"> ✏️ </button>
                </div>

                <div class="metrics-container">

                    <div class="metric-box">
                        <span class="value" id="total-investido">R$00,00</span>
                        <span>Investido</span>
                    </div>

                    <div class="metric-box">
                        <span class="value" id="total-investido">R$00,00</span>
                        <span>Rendimento</span>
                    </div>

                    <div class="grafic-container">

                    </div>

                </div>

            </section>

        </main>

    </main>

</body>

</html>
