<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Patrimõnio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (para ícone de seta, lápis, etc) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/static/css/variables.css">

    <style>

    </style>

</head>

<body>

    <div class="app-container d-flex flex-column justify-content-between p-3">

        <header class="header">


            <div class="d-flex align-items-center">

                <a href="#" class="text-white text-decoration-none fs-4 me-3" aria-label="Voltar">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h1 class="h4 mb-0 fw-light text-white">Simulador de Investimentos</h1>

            </div>


            <form class="" id="form-simulador">

                <div class="row g-3">

                    <div class="col-6">

                        <label class="form-label small fw-bold">Aporte Inicial (R$)</label>
                        <input type="number" id="aporte-inicial" name="aporte_inicial" step="0.01" placeholder="0,00"
                            required>
                    </div>

                    <div class="col-6">
                        <label class="form-label small fw-bold">Aporte Mensal (R$)</label>
                        <input type="number" id="aporte-mensal" name="aporte_mensal" step="0.01" placeholder="0,00"
                            required>
                    </div>

                </div>

            </form>

        </header>

        <main class="card-cinza rounded-4 p-3 my-3 flex-grow-1 d-flex flex-column">

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <div class="d-flex gap-2">
                    <button type="button" class="btn-periodo active">5 anos</button>
                    <button type="button" class="btn-periodo">10 anos</button>
                </div>

                <button type="button" class="btn-edit" id="btn-editar-periodo" title="Editar Período"> <i
                        class="bi bi-pencil-fill"></i> </button>
            </div>


            <div class="row text-center mb-4">
                <div class="metric-box col-6">
                    <span class="value fw-bold fs-6" id="total-investido">R$00,00</span>
                    <span class="small text-secondary fw-semibold">Investido</span>
                </div>

                <div class="metric-box col-6">
                    <span class="value fw-bold fs-6" id="total-rendimento"> R$00,00 </span>
                    <span class="small text-secondary fw-semibold"> Rendimento </span>
                </div>
            </div>

            <div class="grafic-container flex-grow-1 d-flex align-items-center justify-content-center text-center">
                <h2 class="h5 fw-bold text-dark">
                    (Grafico de investido<br>e rendimento)
                </h2>
            </div>

        </main>

    </div>

</body>

</html>
