<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DuckFy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/termos_publico.css') }}">
    {% block styles %}{% endblock %}
</head>


<body class="pagina-publica">
    <canvas id="particulas-fundo" aria-hidden="true"></canvas>
    {% block content %}{% endblock %}
    <script>
        const canvas = document.getElementById("particulas-fundo");
        const ctx = canvas.getContext("2d");
        let particulas = [];
        let largura = 0;
        let altura = 0;
        let animacaoAtiva = true;
        const movimentoReduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function ajustarCanvas() {
            const escala = Math.min(window.devicePixelRatio || 1, 2);
            largura = window.innerWidth;
            altura = window.innerHeight;
            canvas.width = largura * escala;
            canvas.height = altura * escala;
            ctx.setTransform(escala, 0, 0, escala, 0, 0);

            const quantidade = Math.min(100, Math.max(35, Math.floor((largura * altura) / 14000)));
            particulas = Array.from({ length: quantidade }, () => ({
                x: Math.random() * largura,
                y: Math.random() * altura,
                tamanho: Math.random() * 2 + 0.6,
                velocidadeX: (Math.random() - 0.5) * 0.35,
                velocidadeY: (Math.random() - 0.5) * 0.35,
                opacidade: Math.random() * 0.6 + 0.2,
                fase: Math.random() * Math.PI * 2,
                cor: Math.random() > 0.5 ? "124, 77, 255" : "0, 230, 118"
            }));
        }

        function desenharParticulas() {
            ctx.clearRect(0, 0, largura, altura);
            const tempo = performance.now() * 0.001;

            particulas.forEach((particula) => {
                if (!movimentoReduzido) {
                    particula.x += particula.velocidadeX;
                    particula.y += particula.velocidadeY;
                    if (particula.x < -5) particula.x = largura + 5;
                    if (particula.x > largura + 5) particula.x = -5;
                    if (particula.y < -5) particula.y = altura + 5;
                    if (particula.y > altura + 5) particula.y = -5;
                }

                ctx.save();
                ctx.globalAlpha = movimentoReduzido
                    ? particula.opacidade
                    : particula.opacidade * (0.7 + Math.sin(tempo + particula.fase) * 0.3);
                ctx.fillStyle = `rgb(${particula.cor})`;
                ctx.shadowColor = `rgb(${particula.cor})`;
                ctx.shadowBlur = particula.tamanho * 7;
                ctx.beginPath();
                ctx.arc(particula.x, particula.y, particula.tamanho, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (animacaoAtiva && !movimentoReduzido) {
                requestAnimationFrame(desenharParticulas);
            }
        }

        ajustarCanvas();
        desenharParticulas();
        window.addEventListener("resize", ajustarCanvas);
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                animacaoAtiva = false;
            } else if (!movimentoReduzido && !animacaoAtiva) {
                animacaoAtiva = true;
                desenharParticulas();
            }
        });
    </script>
    <script>
        function voltarPaginaPublica(event) {
            const origem = document.referrer ? new URL(document.referrer).origin : "";
            if (origem === location.origin) {
                history.back();
            } else {
                location.href = event.currentTarget.href;
            }
            return false;
        }
    </script>
</body>


</html>
