<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Perfil de {{ usuario.nome }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>

<body class="bg-primary-app">

    <main class="container-fluid px-0 min-vh-100 d-flex flex-column">
        <div class="cartao-perfil-principal flex-grow-1 w-100 d-flex flex-column">

            <!-- TOPO ROXO -->
            <section class="cabecalho-perfil p-4 p-md-5 position-relative">
                <a class="link-voltar position-absolute text-white text-decoration-none fs-4" href="{{ url_for('dashboard') }}" aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h1 class="titulo-pagina text-center text-white fs-3 fw-bold mb-4">Configuração</h1>

                <div class="cartao-usuario mx-auto p-3 p-md-4 rounded-4 d-flex flex-column flex-sm-row align-items-center gap-3">
                    
                    <!-- avatar -->
                    <div class="avatar-container flex-shrink-0">
                        {% if usuario.foto_perfil %}
                            <img src="{{ url_for('static', filename='img/' + usuario.foto_perfil) }}" alt="Foto de {{ usuario.nome }}" class="avatar rounded-circle object-fit-cover" width="70" height="70">
                        {% else %}
                            <div class="avatar" aria-hidden="true">
                                <span class="avatar-cabeca"></span>
                                <span class="avatar-corpo"></span>
                            </div>
                        {% endif %}
                    </div>

                    <!-- dados usuario -->
                    <div class="detalhes-usuario text-center text-sm-start flex-grow-1">
                        <h2 class="nome-usuario fs-4 fw-bold text-white mb-1">Olá, {{ usuario.nome }}!</h2>
                        
                        <!-- ofensiva e xp -->
                        <div class="d-flex align-items-center justify-content-center justify-content-sm-start gap-2 mt-2">
                            <span class="badge bg-warning text-dark d-inline-flex align-items-center gap-1">
                                <i class="fa-solid fa-fire"></i> {{ usuario.dias_ofensiva | default(0) }} dias
                            </span>
                            <span class="badge bg-info text-dark d-inline-flex align-items-center gap-1">
                                <i class="fa-solid fa-star"></i> {{ usuario.pontos_xp | default(0) }} XP
                            </span>
                        </div>
                    </div>

                    <a class="btn btn-editar w-auto d-flex align-items-center justify-content-center gap-2 px-3"
                        href="{{ url_for('editar_perfil') }}">
                        <img src="{{ url_for('static', filename='img/icons/pen.svg') }}" alt="Ícone de Edição" class="icone-editar">
                    </a>
                </div>
            </section>

            <!-- SEÇÃO INFERIOR -->
            <section class="conteudo-perfil flex-grow-1 p-4 p-md-5 d-flex flex-column gap-4">

                <div class="container-conteudo mx-auto w-100">

                    <nav class="secao-lista-config d-flex flex-column gap-2" aria-label="Configurações Adicionais">
                        <h3 class="titulo-secao text-uppercase text-secondary fw-semibold mb-2">Outras opções</h3>

                        <a href="/termos" class="item-lista-config d-flex justify-content-between align-items-center p-3 rounded-3 text-decoration-none text-white">
                            <div class="d-flex align-items-center gap-3">
                                <img src="{{ url_for('static', filename='img/icons/termos.svg') }}" alt="Ícone de Termos e Condições" class="icone-lista">
                                <span>Termos e Condições</span>
                            </div>
                            <i class="fa-solid fa-chevron-right seta small"></i>
                        </a>

                        <a href="/acessibilidade" class="item-lista-config d-flex justify-content-between align-items-center p-3 rounded-3 text-decoration-none text-white">
                            <div class="d-flex align-items-center gap-3">
                                <img src="{{ url_for('static', filename='img/icons/acessibilidade.svg') }}" alt="Ícone de Acessibilidade" class="icone-lista">
                                <span>Acessibilidade</span>
                            </div>
                            <i class="fa-solid fa-chevron-right seta small"></i>
                        </a>

                        <a href="/logout" class="item-lista-config sair d-flex justify-content-between align-items-center p-3 rounded-3 text-decoration-none text-danger mt-2">
                            <div class="d-flex align-items-center gap-3">
                                <img src="{{ url_for('static', filename='img/icons/logout.svg') }}" alt="Sair" class="sidebar-icon">
                                <span>Sair da conta</span>
                            </div>
                        </a>
                    </nav>

                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
