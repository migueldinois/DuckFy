<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
</head>

<body class="bg-primary-app">

    <main class="container-fluid px-0 min-vh-100 d-flex flex-column">
        <div class="cartao-perfil-principal flex-grow-1 w-100 d-flex flex-column">

            <section class="cabecalho-perfil p-4 p-md-5 position-relative">
                <a class="link-voltar position-absolute text-white text-decoration-none fs-4" href="#"
                    aria-label="Voltar">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>

                <h1 class="titulo-pagina text-center text-white fs-3 fw-bold mb-4">Configuração</h1>

                <div
                    class="cartao-usuario mx-auto p-3 p-md-4 rounded-4 d-flex flex-column flex-sm-row align-items-center gap-3">
                    <div class="avatar-container flex-shrink-0">
                        <div class="avatar" aria-hidden="true">
                            <span class="avatar-cabeca"></span>
                            <span class="avatar-corpo"></span>
                        </div>
                    </div>

                    <div class="detalhes-usuario text-center text-sm-start flex-grow-1">
                        <h2 class="nome-usuario fs-4 fw-bold text-white mb-1">Olá, Fulano!</h2>
                        </span>
                    </div>

                    <a class="btn btn-editar w-20 w-sm-auto d-flex align-items-center justify-content-center gap-2"
                        href="{{ url_for('editar_perfil') }}">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </a>
                </div>
            </section>

            <section class="conteudo-perfil flex-grow-1 p-4 p-md-5 d-flex flex-column gap-4">

                <div class="container-conteudo mx-auto w-100">

                    <nav class="secao-lista-config d-flex flex-column gap-2" aria-label="Configurações Adicionais">
                        <h3 class="titulo-secao text-uppercase text-secondary fw-semibold mb-2">Outras opções</h3>

                        <a href="#"
                            class="item-lista-config d-flex justify-content-between align-items-center p-3 rounded-3 text-decoration-none text-white">
                            <div class="d-flex align-items-center gap-3">
                                <i class="fa-regular fa-file-lines icone-lista fs-5"></i>
                                <span>Termos e Condições</span>
                            </div>
                            <i class="fa-solid fa-chevron-right seta small"></i>
                        </a>

                        <a href="#"
                            class="item-lista-config d-flex justify-content-between align-items-center p-3 rounded-3 text-decoration-none text-white">
                            <div class="d-flex align-items-center gap-3">
                                <i class="fa-solid fa-headset icone-lista fs-5"></i>
                                <span>Acessibilidade</span>
                            </div>
                            <i class="fa-solid fa-chevron-right seta small"></i>
                        </a>

                    
                    </nav>
                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
