<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duckfy</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/bottom-bar.css">
    <link rel="stylesheet" href="static/css/sidebar.css">
</head>

<body class="app-body">

    <div class="app-container">
        <!-- Sidebar / Navegação Principal (Desktop) -->
        <aside class="sidebar">
            <a href="/" class="sidebar-brand">
                <i class="bi bi-box-seam-fill brand-icon"></i>
                <span class="brand-text">DuckFy</span>
            </a>

            <hr class="sidebar-divider">

            <ul class="sidebar-menu list-unstyled">
                <li>
                    <a href="/" class="sidebar-link active">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="/" class="sidebar-link">
                        <i class="bi bi-compass"></i>
                        <span>Extrato</span>
                    </a>
                </li>
                <li>
                    <a href="/" class="sidebar-link">
                        <i class="bi bi-grid-fill"></i>
                        <span>Simulador de Patrimônio</span>
                    </a>
                </li>
                <li>
                    <a href="/" class="sidebar-link">
                        <i class="bi bi-person-fill"></i>
                        <span>Perfil</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="content-header">
                <h1 class="page-title">Página Principal</h1>
            </header>

            <section class="content-body">
                <p>Bem-vindo ao sistema!</p>
            </section>
        </main>
    </div>

    <!-- Bottom Bar (Mobile) -->
    <nav class="bottom-bar">
        <div class="bottom-bar-container">
            <a href="/" class="nav-icon-btn active" title="Dashboard">
                <i class="bi bi-speedometer2 fs-5"></i>
            </a>
            <a href="/" class="nav-icon-btn" title="Explorar">
                <i class="bi bi-compass fs-5"></i>
            </a>
            <a href="/" class="nav-icon-btn" title="Serviços">
                <i class="bi bi-grid-fill fs-5"></i>
            </a>
            <a href="/" class="nav-icon-btn" title="Perfil">
                <i class="bi bi-person-fill fs-5"></i>
            </a>
        </div>
    </nav>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
