<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}DuckFy{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS principal -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/layout.css') }}"
    >

    <!-- CSS da página -->
    {% block extra_css %}
    {% endblock %}
</head>

<body class="app-body">

    <div class="app-container">

        <!-- sidebar -->
        <aside class="sidebar collapsed" id="sidebar">

            <!-- botão da sidebar -->
            <button
                class="sidebar-toggle-btn d-none d-md-flex"
                id="sidebarToggle"
                type="button"
                title="Alternar Menu"
            >
                <i class="bi bi-chevron-right" id="toggleIcon"></i>
            </button>

            <!-- logo -->
            <a href="/" class="sidebar-brand">
                <span class="brand-text">DuckFy</span>
            </a>

            <hr class="sidebar-divider">

            <!-- menu -->
            <ul class="sidebar-menu list-unstyled">

                <li>
                    <a href="/" class="sidebar-link active" title="Dashboard">
                        <img
                            src="{{ url_for('static', filename='img/icons/dashboard.svg') }}"
                            alt="Dashboard"
                            class="sidebar-icon"
                        >

                        <span class="brand-text">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li>
                    <a href="/" class="sidebar-link" title="Extrato">
                        <img
                            src="{{ url_for('static', filename='img/icons/extrato.svg') }}"
                            alt="Extrato"
                            class="sidebar-icon"
                        >

                        <span class="brand-text">
                            Extrato
                        </span>
                    </a>
                </li>

                <li>
                    <a href="/" class="sidebar-link" title="Simulador de Patrimônio">
                        <img
                            src="{{ url_for('static', filename='img/icons/simulador.svg') }}"
                            alt="Simulador de Patrimônio"
                            class="sidebar-icon"
                        >

                        <span class="brand-text">
                            Simulador
                        </span>
                    </a>
                </li>

                <li>
                    <a href="/" class="sidebar-link" title="Perfil">
                        <img
                            src="{{ url_for('static', filename='img/icons/perfill.svg') }}"
                            alt="Perfil"
                            class="sidebar-icon"
                        >

                        <span class="brand-text">
                            Perfil
                        </span>
                    </a>
                </li>

            </ul>

        </aside>

        <!-- conteúdo principal -->
        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

    <!-- barra inferior -->
    {% include 'components/bottom_bar.html' %}

    <!-- javascript da sidebar -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const toggleIcon = document.getElementById('toggleIcon');

        toggleBtn?.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');

            toggleIcon.classList.toggle('bi-chevron-right');
            toggleIcon.classList.toggle('bi-chevron-left');
        });
    </script>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
