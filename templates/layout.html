
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}DuckFy{% endblock %}</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones do Bootstrap -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Ficheiros CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="/static/css/extrato.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/simulador_patrimonio.css') }}">
  <link rel="stylesheet" href="/static/css/simulador_patrimonio.css">
  
  
  {% block extra_css %}
  {% endblock %}
</head>

<body class="app-body">

  <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar collapsed" id="sidebar">


      <!-- Logo -->
      <a href="/dashboard" class="sidebar-brand">
        <span class="brand-text">DuckFy</span>
      </a>

      <hr class="sidebar-divider">

      <!-- Navegação -->
      <ul class="sidebar-menu list-unstyled">

        <!-- Dashboard -->
        <li>
          <a
            href="/dashboard"
            class="sidebar-link {% if request.path.rstrip('/') == '/dashboard' %}active{% endif %}"
            title="Dashboard"
            {% if request.path.rstrip('/') == '/dashboard' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/dashboard.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Dashboard</span>
          </a>
        </li>

        <!-- Extrato -->
        <li>
          <a
            href="/extrato"
            class="sidebar-link {% if request.path.rstrip('/') == '/extrato' %}active{% endif %}"
            title="Extrato"
            {% if request.path.rstrip('/') == '/extrato' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/extrato.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Extrato</span>
          </a>
        </li>

        <!-- Simulador -->
        <li>
          <a
            href="/simulador"
            class="sidebar-link {% if request.path.rstrip('/') == '/simulador' %}active{% endif %}"
            title="Simulador de Patrimônio"
            {% if request.path.rstrip('/') == '/simulador' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/simulador.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Simulador</span>
          </a>
        </li>

        <!-- Lançamentos -->
        <li>
          <a
            href="/lancamento"
            class="sidebar-link {% if request.path.rstrip('/') == '/lancamento' %}active{% endif %}"
            title="Lançamentos"
            {% if request.path.rstrip('/') == '/lancamento' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/lancamento.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Lançamentos</span>
          </a>
        </li>

        <!-- Categorias -->
        <li>
          <a
            href="/categorias"
            class="sidebar-link {% if request.path.rstrip('/') == '/categorias' %}active{% endif %}"
            title="Categorias"
            {% if request.path.rstrip('/') == '/categorias' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/categoria.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Categorias</span>
          </a>
        </li>

        <!-- Reserva de Emergência -->
        <li>
          <a
            href="/reserva_emergencia"
            class="sidebar-link {% if request.path.rstrip('/') == '/reserva_emergencia' %}active{% endif %}"
            title="Reserva de Emergência"
            {% if request.path.rstrip('/') == '/reserva_emergencia' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/reserva.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Reserva de Emergência</span>
          </a>
        </li>

        <!-- Perfil -->
        <li>
          <a
            href="/perfil"
            class="sidebar-link {% if request.path.rstrip('/') == '/perfil' %}active{% endif %}"
            title="Perfil"
            {% if request.path.rstrip('/') == '/perfil' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/perfill.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Perfil</span>
          </a>
        </li>

        <!-- Sequência -->
        <li>
          <a
            href="/sequencia"
            class="sidebar-link {% if request.path.rstrip('/') == '/sequencia' %}active{% endif %}"
            title="Sequência"
            {% if request.path.rstrip('/') == '/sequencia' %}aria-current="page"{% endif %}
          >
            <img
              src="{{ url_for('static', filename='img/icons/sequencia.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Sequência</span>
          </a>
        </li>

        <!-- Sair da conta -->
        <li class="mt-auto">
          <a
            href="/logout"
            class="sidebar-logout"
            title="Sair"
          >
            <img
              src="{{ url_for('static', filename='img/icons/logout.svg') }}"
              alt=""
              class="sidebar-icon"
            >
            <span class="brand-text">Sair</span>
          </a>
        </li>

      </ul>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

  </div>

  <!-- Barra inferior para dispositivos móveis -->
  {% include 'components/bottom_bar.html' %}

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Alternância de tema -->
  <script
    src="{{ url_for('static', filename='js/tema.js') }}"
    defer
  ></script>

  <!-- Gerenciador de modais -->
  <script
    src="{{ url_for('static', filename='js/modalManager.js') }}"
  ></script>
  <!-- js layout -->
  <script
    src="{{ url_for('static', filename='js/layout.js') }}"
  ></script>

  <!-- Scripts específicos das páginas -->
  {% block extra_js %}{% endblock %}


</body>
</html>
