<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lançamento</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <link rel="stylesheet" href="/static/css/variables.css">
    
    <link rel="stylesheet" href="/static/css/lancamentos.css">
</head>

<body>

    <main class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <button type="button" class="btn-back" aria-label="Voltar">&larr;</button>
            <h1>Lançamento</h1>
        </header>

        <!-- Cartão Principal -->
        <div class="card">
            <form id="form-lancamento">

                <!-- Toggle Entrada / Saída -->
                <div class="toggle-type" role="radiogroup" aria-label="Tipo de Lançamento">
                    <input type="radio" id="entrada" name="tipo" value="entrada" checked />
                    <label for="entrada">Entrada</label>

                    <input type="radio" id="saida" name="tipo" value="saida" />
                    <label for="saida">Saída</label>
                </div>

                <!-- Local -->
                <div class="form-group">
                    <label for="local">Local</label>
                    <input type="text" id="local" name="local" />
                </div>

                <!-- Categoria -->
                <div class="form-group">
                    <label>Categoria</label>
                    <div class="category-selector" role="radiogroup" aria-label="Categoria">
                        <input type="radio" id="cat1" name="categoria" value="casa" />
                        <label for="cat1"></label>

                        <input type="radio" id="cat2" name="categoria" value="carro" />
                        <label for="cat2"></label>

                        <input type="radio" id="cat3" name="categoria" value="comida" />
                        <label for="cat3"></label>


                    </div>
                </div>

                <!-- Sub-Categoria -->
                <div class="form-group">
                    <label for="subcategoria">Sub-Categoria</label>
                    <select id="subcategoria" name="subcategoria">
                        <option value="" disabled selected></option>
                    </select>
                </div>

                <!-- Valor -->
                <div class="form-group">
                    <label for="valor">Valor</label>
                    <div class="input-prefix">
                        <span class="currency-symbol">$</span>
                        <input type="text" id="valor" name="valor" placeholder="0,00" inputmode="numeric" />
                    </div>
                </div>

                <!-- Observação -->
                <div class="form-group">
                    <label for="observacao">Observação (opcional)</label>
                    <textarea id="observacao" name="observacao" rows="3"></textarea>
                </div>

            </form>
        </div>

        <!-- Botão de Ação -->
        <div class="actions">
            <button type="submit" form="form-lancamento" class="btn-primary">
                Lançar Entrada
            </button>
        </div>
    </main>

</body>

</html>
