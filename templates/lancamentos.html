{% extends 'layout.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lancamentos.css') }}">
{% endblock %}

{% block content %}
<div id="page-lancamento" class="py-3">
  <div class="style-container">

    <!-- Header superior -->
    <header class="d-flex align-items-center mb-3">
      <button type="button" class="btn-voltar border-0 bg-transparent text-white p-0 me-3 fs-4" aria-label="Voltar" onclick="history.back()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h1 class="h4 mb-0 fw-semibold text-white">Lançamento</h1>
    </header>

    <!-- CARD PRINCIPAL DO FORMULÁRIO -->
    <div class="lancamento-block p-4 rounded-4 shadow-lg">
      <form action="/salvar_lancamento" method="POST">

        <!-- Seletor Tipo: Entrada / Saída -->
        <div class="d-flex justify-content-center mb-4">
          <div class="tipo-switch-container p-1 rounded-pill d-inline-flex">
            <input type="radio" class="btn-check" name="tipo_transacao" id="tipoEntrada" value="entrada" checked>
            <label class="btn btn-tipo-switch rounded-pill px-4 py-2" for="tipoEntrada">
              <i class="bi bi-arrow-down-left-circle me-1"></i> Entrada
            </label>

            <input type="radio" class="btn-check" name="tipo_transacao" id="tipoSaida" value="saida">
            <label class="btn btn-tipo-switch rounded-pill px-4 py-2" for="tipoSaida">
              <i class="bi bi-arrow-up-right-circle me-1"></i> Saída
            </label>
          </div>
        </div>

        <div class="row g-3">
          <!-- Campo Local -->
          <div class="col-12 col-md-6">
            <label for="local" class="form-label text-white-50 fs-7 fw-medium mb-1">Local</label>
            <input type="text" class="form-control form-control-custom rounded-3" id="local" name="local" placeholder="Ex: Supermercado, Salário, etc." required>
          </div>

          <!-- Campo Valor -->
          <div class="col-12 col-md-6">
            <label for="valor-display" class="form-label text-white-50 fs-7 fw-medium mb-1">Valor</label>
            <div class="input-group">
              <span class="input-group-text form-control-custom border-end-0 text-white-50">R$</span>
              <input type="text" inputmode="numeric" autocomplete="off" class="form-control form-control-custom border-start-0 rounded-end-3" id="valor-display" placeholder="0,00" aria-label="Valor da transação" required>
              <input type="hidden" id="valor" name="valor">
            </div>
          </div>

          <!-- Seleção de Categoria -->
          <div class="col-12 mb-2">
            <label class="form-label text-white-50 fs-7 fw-medium d-block mb-2">Categoria</label>
            <div class="d-flex flex-wrap gap-2">
              <input type="radio" class="btn-check" name="categoria" id="catHome" value="moradia" checked>
              <label class="btn btn-categoria-icon rounded-circle d-flex align-items-center justify-content-center" for="catHome" title="Moradia">
                <i class="bi bi-house-door fs-5"></i>
              </label>

              <input type="radio" class="btn-check" name="categoria" id="catTransport" value="transporte">
              <label class="btn btn-categoria-icon rounded-circle d-flex align-items-center justify-content-center" for="catTransport" title="Transporte">
                <i class="bi bi-car-front fs-5"></i>
              </label>

              <input type="radio" class="btn-check" name="categoria" id="catFood" value="alimentacao">
              <label class="btn btn-categoria-icon rounded-circle d-flex align-items-center justify-content-center" for="catFood" title="Alimentação">
                <i class="bi bi-cup-hot fs-5"></i>
              </label>

              <input type="radio" class="btn-check" name="categoria" id="catWork" value="trabalho">
              <label class="btn btn-categoria-icon rounded-circle d-flex align-items-center justify-content-center" for="catWork" title="Trabalho / Salário">
                <i class="bi bi-briefcase fs-5"></i>
              </label>
            </div>
          </div>

          <!-- Campo Sub-Categoria -->
          <div class="col-12">
            <label id="subcategoria-label" class="form-label text-white-50 fs-7 fw-medium mb-1">Sub-Categoria</label>
            <div class="custom-select" id="subcategoria-select">
              <select id="subcategoria" name="subcategoria" hidden aria-hidden="true" tabindex="-1">
              <option value="" selected disabled>Selecione uma sub-categoria...</option>
              <option value="mercado">Mercado</option>
              <option value="restaurante">Restaurante / Lanchonete</option>
              <option value="combustivel">Combustível</option>
              <option value="aluguel">Aluguel / Contas</option>
              </select>
              <button type="button" class="custom-select-trigger" id="subcategoria-trigger" role="combobox"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="subcategoria-options"
                aria-autocomplete="none" aria-labelledby="subcategoria-label subcategoria-value">
                <span id="subcategoria-value">Selecione uma sub-categoria...</span>
                <span class="custom-select-chevron" aria-hidden="true"></span>
              </button>
              <div class="custom-select-options" id="subcategoria-options" role="listbox"
                aria-labelledby="subcategoria-label" hidden>
                <div class="custom-select-option" role="option" aria-disabled="true" data-value="">Selecione uma sub-categoria...</div>
                <div class="custom-select-option" role="option" aria-selected="false" data-value="mercado">Mercado</div>
                <div class="custom-select-option" role="option" aria-selected="false" data-value="restaurante">Restaurante / Lanchonete</div>
                <div class="custom-select-option" role="option" aria-selected="false" data-value="combustivel">Combustível</div>
                <div class="custom-select-option" role="option" aria-selected="false" data-value="aluguel">Aluguel / Contas</div>
              </div>
            </div>
          </div>

          <!-- Campo Observação -->
          <div class="col-12">
            <label for="observacao" class="form-label text-white-50 fs-7 fw-medium mb-1">Observação (opcional)</label>
            <textarea class="form-control form-control-custom rounded-3" id="observacao" name="observacao" rows="3" placeholder="Adicione algum detalhe extra..."></textarea>
          </div>

          <!-- Botão Submeter Form -->
          <div class="col-12 mt-4">
            <button type="submit" class="btn-purple-action">Lançar Transação</button>
          </div>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/lancamentos.js') }}" defer></script>
{% endblock %}
