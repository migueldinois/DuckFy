<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duckfy - Categorias</title>

    <link rel="stylesheet" href="static/css/variables.css">
    <link rel="stylesheet" href="static/css/categorias.css">
</head>

<body>

    <main class="categorias">

        <!-- título da página -->
        <h1 class="categorias__titulo">Categorias</h1>

        <!-- categorias de saídas -->
        <section class="categoria__grupo">

            <h2 class="categoria__titulo">Categorias de Saídas</h2>

            <div class="categoria__lista">

                <!-- alimentação -->
                <article class="categoria">
                    <div class="categoria__icone"></div>

                    <div class="categoria__info">
                        <h3>Alimentação</h3>
                        <p>Restaurantes,<br>Mercados, Lanches</p>
                    </div>
                </article>

                <!-- transporte -->
                <article class="categoria">
                    <div class="categoria__icone"></div>

                    <div class="categoria__info">
                        <h3>Transporte</h3>
                        <p>Combustível, Uber,<br>Ônibus</p>
                    </div>
                </article>

                <!-- lazer -->
                <article class="categoria">
                    <div class="categoria__icone"></div>

                    <div class="categoria__info">
                        <h3>Lazer</h3>
                        <p>Cinema, Shows,<br>Festas</p>
                    </div>

                    <span class="categoria__seta">></span>
                </article>

            </div>

        </section>

        <!-- categorias de entradas -->
        <section class="categoria__grupo">

            <h2 class="categoria__titulo">Categorias de Entradas</h2>

            <div class="categoria__lista">

                <!-- salário -->
                <article class="categoria">
                    <div class="categoria__icone"></div>

                    <div class="categoria__info">
                        <h3>Salário</h3>
                        <p>Emprego 1, Emprego 2,<br>Empreendimento...</p>
                    </div>
                </article>

                <!-- renda extra -->
                <article class="categoria">
                    <div class="categoria__icone"></div>

                    <div class="categoria__info">
                        <h3>Renda Extra</h3>
                        <p>Pequenos serviços</p>
                    </div>

                    <span class="categoria__seta">></span>
                </article>

            </div>

        </section>

    </main>

 

</body>

</html>
