{% extends 'layout.html' %}

{% block title %}Categorias - DuckFy{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/categorias.css') }}">
{% endblock %}

{% block content %}

<main class="categorias">

    <h1 class="categorias__titulo">Categorias</h1>

    <!-- saída -->
    <section class="categoria__grupo">

        <h2 class="categoria__titulo">
            Categoria de Saída
        </h2>

        <div class="categoria__lista">

            <article class="categoria">

                <div class="categoria__icone"></div>

                <div class="categoria__info">
                    <h3>Lazer</h3>

                    <p>
                        Cinema, Shows,<br>
                        Festas
                    </p>
                </div>

                <a
                    href="#"
                    class="categoria__seta"
                    aria-label="Ver categoria Lazer"
                >
                    >
                </a>

            </article>

        </div>

    </section>

    <!-- entrada -->
    <section class="categoria__grupo">

        <h2 class="categoria__titulo">
            Categoria de Entrada
        </h2>

        <div class="categoria__lista">

            <article class="categoria">

                <div class="categoria__icone"></div>

                <div class="categoria__info">
                    <h3>Renda Extra</h3>

                    <p>
                        Pequenos serviços
                    </p>
                </div>

                <a
                    href="#"
                    class="categoria__seta"
                    aria-label="Ver categoria Renda Extra"
                >
                    >
                </a>

            </article>

        </div>

    </section>

</main>

{% endblock %}
