<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Editar Perfil</title>
    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_perfil.css') }}">
</head>
<body>
    <main class="tela-edicao">
        <!-- Topo Roxo -->
        <section class="cabecalho-perfil">
            <a class="link-voltar" href="{{ url_for('perfil') }}" aria-label="Voltar para o perfil">&larr;</a>
            <h1 class="titulo-pagina">Editar Perfil</h1>
            <a class="link-salvar" href="{{ url_for('perfil') }}">Salvar</a>

            <div class="resumo-perfil">
                <div class="avatar avatar-grande" aria-hidden="true">
                    <span class="avatar-cabeca"></span>
                    <span class="avatar-corpo"></span>
                </div>
                <a class="link-foto" href="#">Alterar foto</a>
            </div>
        </section>

        <!-- Formulário Inferior -->
        <form class="formulario-perfil">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com">

            <button type="button">Alterar senha</button>
            <button type="button">Sair da conta</button>
            <button type="button">Excluir conta</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
