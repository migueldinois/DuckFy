<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Editar Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <main class="phone-screen edit-screen">
        <section class="profile-header edit-header">
            <a class="back-link" href="{{ url_for('perfil') }}" aria-label="Voltar">&larr;</a>
            <span class="page-title">Editar Perfil</span>
            <a class="save-link" href="{{ url_for('perfil') }}">Salvar</a>

            <div class="edit-profile-summary">
                <div class="avatar large-avatar" aria-hidden="true">
                    <span class="avatar-head"></span>
                    <span class="avatar-body"></span>
                </div>
                <a class="photo-link" href="#">Alterar foto</a>
            </div>
        </section>

        <form class="profile-form">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com">

            <button type="button">Alterar senha</button>
            <button type="button">Sair da conta</button>
            <button type="button">Excluir conta</button>
        </form>
    </main>
</body>
</html>
