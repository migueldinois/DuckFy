<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Editar Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_perfil.css') }}">
</head>
<body class="bg-app">

    <main class="container-fluid px-0 min-vh-100 d-flex flex-column">
        <!-- Envolvemos tudo em uma tag <form> para controlar o envio do Salvar -->
        <form id="form-editar-perfil" class="tela-edicao flex-grow-1 w-100 d-flex flex-column" action="{{ url_for('perfil') }}" method="POST" novalidate>
            
            <!-- TOPO ROXO -->
            <section class="cabecalho-perfil p-4 p-md-5 position-relative text-center">
                <a class="link-voltar position-absolute text-white text-decoration-none fs-4" href="{{ url_for('perfil') }}" aria-label="Voltar para o perfil">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                
                <h1 class="titulo-pagina text-white fs-3 fw-bold mb-0">Editar Perfil</h1>
                
                <!-- Botão Salva-->
                <button type="submit" class="link-salvar position-absolute text-white bg-transparent border-0 fs-5">Salvar</button>

                <div class="resumo-perfil mt-4 d-flex flex-column align-items-center gap-2">
                    <div class="avatar avatar-grande d-flex align-items-center justify-content-center" aria-hidden="true">
                        <span class="avatar-cabeca"></span>
                        <span class="avatar-corpo"></span>
                    </div>
                    <a class="link-foto text-white text-decoration-none small fw-medium mt-1" href="#">Alterar foto</a>
                </div>
            </section>

            <!-- FORMULÁRIO INFERIOR -->
            <section class="conteudo-formulario flex-grow-1 p-4 p-md-5 d-flex justify-content-center">
                <div class="formulario-perfil w-100 d-flex flex-column gap-3">
                    
                    <div class="grupo-campo d-flex flex-column gap-1">
                        <label for="nome" class="form-label text-white fw-semibold small">Alterar Nome</label>
                        <input id="nome" name="nome" type="text" class="form-control campo-input p-3 text-white border-0" placeholder="Digite seu nome">

                        <span id="erro-nome" class="text-danger small mt-1 d-none">Por favor, insira um nome. </span>
                    </div>

                    <div class="grupo-campo d-flex flex-column gap-1">
                        <label for="email" class="form-label text-white fw-semibold small">Alterar E-mail</label>
                        <input id="email" name="email" type="email" class="form-control campo-input p-3 text-white border-0" placeholder="seuemail@exemplo.com">

                        <span id="erro-email" class="text-danger small mt-1 d-none">Por favor, insira um e-mail válido (ex: usuario@dominio.com).</span>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-roxo p-3 rounded-3 fw-semibold" type="button">Alterar senha</button>
                        <button class="btn btn-escuro p-3 rounded-3 fw-semibold" type="button">Sair da conta</button>
                        <button class="btn btn-vermelho p-3 rounded-3 fw-semibold" type="button">Excluir conta</button>
                    </div>

                </div>
            </section>

        </form>
    </main>

    <script>
        // Validação do formulário de edição de perfil
        const formularioPerfil = document.getElementById('form-editar-perfil');
        const campoNome = document.getElementById('nome');
        const campoEmail = document.getElementById('email');
        const mensagemErroNome = document.getElementById('erro-nome');
        const mensagemErroEmail = document.getElementById('erro-email');
        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Função para atualizar a exibição de erro e o estado do campo
        function atualizarErro(campo, mensagem, invalido) {
            mensagem.classList.toggle('d-none', !invalido);
            campo.classList.toggle('invalido', invalido);
        }

        // Função para validar o formulário antes do envio
        function validarFormulario() {
            const nomeInvalido = campoNome.value.trim() === '';
            const emailInvalido = !regexEmail.test(campoEmail.value.trim());

            // Atualiza a exibição de erro para cada campo
            atualizarErro(campoNome, mensagemErroNome, nomeInvalido);
            atualizarErro(campoEmail, mensagemErroEmail, emailInvalido);

            if (nomeInvalido) {
                campoNome.focus();
            } else if (emailInvalido) {
                campoEmail.focus();
            }

            // Retorna true se ambos os campos forem válidos, caso contrário, retorna false
            return !nomeInvalido && !emailInvalido;
        }

        formularioPerfil.addEventListener('submit', function(event) {
            if (!validarFormulario()) {
                event.preventDefault();
            }
        });

        // atualiza a validação em tempo real enquanto o usuário digita
        formularioPerfil.addEventListener('input', function(event) {
            if (event.target === campoNome) {
                atualizarErro(campoNome, mensagemErroNome, campoNome.value.trim() === '');
            } else if (event.target === campoEmail) {
                atualizarErro(campoEmail, mensagemErroEmail, !regexEmail.test(campoEmail.value.trim()));
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
