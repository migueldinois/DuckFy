<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckFy - Editar Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_perfil.css') }}">
</head>
<body>
    <main class="tela-edicao">
        <!-- Topo Roxo -->
        <section class="cabecalho-perfil">
            <a class="link-voltar" href="{{ url_for('perfil') }}" aria-label="Voltar para o perfil">&larr;</a>
            <h1 class="titulo-pagina">Editar Perfil</h1>
            <a class="link-salvar" href="{{ url_for('perfil') }}">Salvar</a>

            <div class="resumo-perfil">
                <div class="avatar avatar-grande" aria-hidden="true">
                    <span class="avatar-cabeca"></span>
                    <span class="avatar-corpo"></span>
                </div>
                <a class="link-foto" href="#">Alterar foto</a>
            </div>
        </section>

        <!-- Formulário Inferior -->
        <form class="formulario-perfil">
            <div class="mb-3">
        <label for="nome" class="form-label text-white">Nome</label>
        <input id="nome" name="nome" type="text" class="form-control" placeholder="Digite seu nome">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label text-white">E-mail</label>
        <input id="email" name="email" type="email" class="form-control" placeholder="seuemail@exemplo.com">
    </div>

    <div class="d-grid gap-2 mt-4">
        <button class="btn btn-primary" type="button">Alterar senha</button>
        <button class="btn btn-outline-light" type="button">Sair da conta</button>
        <button class="btn btn-danger" type="button">Excluir conta</button>
    </div>
        </form>
    </main>
</body>
</html>
