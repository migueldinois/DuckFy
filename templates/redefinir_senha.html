

    <main class="container">

        <h1 class="logo">
            <span>Recuperação de senha</span>
        </h1>

        <form action="/redefinir-senha" method="POST">

            <div class="campo">
                <label for="senha">Digite sua nova senha</label>

                <input type="password" id="senha" name="senha" required>

                <div class="regras">
                    <p>Tamanho mínimo: Pelo menos 8 caracteres.</p>

                    <p>Letras maiúsculas: No mínimo 1 letra maiúscula (A-Z).</p>

                    <p>Caracteres especiais: No mínimo 1 caractere especial (ex: ! @ # $ % ^ & * _ - + = ?).</p>
                </div>
            </div>

            <div class="campo campo-confirmacao">
                <label for="confirmar_senha">Digite novamente</label>

                <input type="password" id="confirmar_senha" name="confirmar_senha" required>
            </div>

            <button type="submit">CONFIRMAR</button>

        </form>

        <div class="aviso-sucesso" id="aviso-sucesso">

        <h2>Senha alterada!</h2>

        <p>Sua senha foi alterada com sucesso.</p>

        <button type="button" class="btn-continuar">
            CONTINUAR
        </button>

    </div>

    </main>

</body>
</html>

<script>
    const formulario = document.querySelector("form");
    const aviso = document.getElementById("aviso-sucesso");
    const botaoContinuar = document.querySelector(".btn-continuar");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmar_senha").value;

        if (senha !== confirmarSenha) {
            alert("As senhas não são iguais!");
            return;
        }

        formulario.style.display = "none";
        document.querySelector("").style.display = "none";

        aviso.style.display = "flex";
    });

    botaoContinuar.addEventListener("click", function() {
        window.location.href = "/login";
    });
    
</script>
