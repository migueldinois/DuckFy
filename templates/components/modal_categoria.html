
<link rel="stylesheet" href="{{ url_for('static', filename='css/duckfy-modal.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/emoji-picker.css') }}">

<div id="modalNovaCategoria" class="duckfy-modal">
    <div class="dash-card modal-content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="card-section-title m-0">Nova Categoria</h3>

            <button type="button" class="btn-close-custom" data-close-modal>
                &times;
            </button>
        </div>

        <form action="/categorias/criar" method="POST">

            <!-- campo nome -->
            <div class="mb-3">
                <label for="nome" class="card-subtitle d-block mb-1">Nome</label>

                <div class="input-icon-wrapper">
                    <img
                        src="{{ url_for('static', filename='img/icons/nome.svg') }}"
                        class="input-icon"
                        alt="Nome"
                    >

                    <input
                        type="text"
                        name="nome"
                        id="nome"
                        class="search-input input-with-icon"
                        placeholder="Ex: Alimentação"
                        required
                    >
                </div>
            </div>

            <!-- campo tipo -->
            <div class="mb-3">
                <label for="tipo" class="card-subtitle d-block mb-1">Tipo</label>

                <div class="input-icon-wrapper">
                    <img
                        src="{{ url_for('static', filename='img/icons/tipo.svg') }}"
                        class="input-icon"
                        alt="Tipo"
                    >

                    <select
                        name="tipo"
                        id="tipo"
                        class="search-input input-with-icon"
                        required
                    >
                        <option value="SAIDA">Saída</option>
                        <option value="ENTRADA">Entrada</option>
                    </select>
                </div>
            </div>

            <!-- campo emoji -->
            <div class="mb-3">
                <label for="emoji" class="card-subtitle d-block mb-1">Emoji</label>

                <div class="input-icon-wrapper emoji-field-wrapper">
                    <img
                        src="{{ url_for('static', filename='img/icons/emoji.svg') }}"
                        class="input-icon emoji-icon-trigger"
                        alt="Abrir seletor de emojis"
                        data-emoji-trigger="emoji"
                        role="button"
                        tabindex="0"
                        aria-label="Abrir seletor de emojis"
                    >

                    <input
                        type="text"
                        name="emoji"
                        id="emoji"
                        class="search-input input-with-icon emoji-input"
                        placeholder="Ex: 🍔"
                        required
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- campo cor -->
            <div class="mb-3">
                <label for="cor" class="card-subtitle d-block mb-1">Cor</label>

                <div class="color-picker-wrapper">
                    <input
                        type="color"
                        name="cor"
                        id="cor"
                        class="color-input-hidden"
                        value="#7C4DFF"
                        oninput="atualizarCorPreview(this.value)"
                    >

                    <span
                        id="colorBox"
                        class="color-picker-custom"
                        style="background-color: #7C4DFF;"
                    ></span>
                </div>
            </div>

            <button type="submit" class="btn-purple-action w-100 mt-2">
                Criar Categoria
            </button>

        </form>
    </div>
</div>

<!-- dados dos emojis -->
<script>
    window.emojiMartDataUrl = 'https://cdn.jsdelivr.net/npm/@emoji-mart/data';
</script>

<!-- biblioteca de emojis -->
<script
    src="https://cdn.jsdelivr.net/npm/emoji-mart@5.6.0/dist/browser.js"
    defer
></script>

<!-- javascript das categorias -->
<script
    src="{{ url_for('static', filename='js/categorias.js') }}"
    defer
></script>
