<div id="modalAdicionarDinheiro" class="duckfy-modal">
    <div class="dash-card modal-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="card-section-title m-0">Adicionar dinheiro</h3>
            <button type="button" class="btn-close-custom" data-close-modal>&times;</button>
        </div>

        <form action="{{ url_for('adicionar_dinheiro') }}" method="POST" id="formAdicionarDinheiro">
            <div class="mb-3">
                <label for="conta_origem" class="card-subtitle d-block mb-1">
                    Conta a adicionar  
                </label>

                <div class="input-icon-wrapper">
                    <select name="id_conta" id="conta_origem" class="search-input" required>
                        <option value="" disabled selected>Selecione onde adicionar</option>

                        {% for conta in contas_bancarias %}
                        <option value="{{ conta.id_conta }}" data-saldo="{{ conta.saldo_atual }}">
                            {{ conta.nome_conta }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <small class="card-subtitle d-block mt-1" id="saldoContaOrigem"></small>
            </div>

            <div class="mb-3">
                <label for="valor_transferencia" class="card-subtitle d-block mb-1">
                    Valor a adicionar (R$)
                </label>

                <div class="input-icon-wrapper">
                    <input type="number" name="valor" id="valor_transferencia" class="search-input" placeholder="0,00"
                        min="0.01" step="0.01" required>
                </div>
            </div>

            <div class="dash-card mb-3" id="resumoTransferencia" hidden>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="card-subtitle">Saldo restante na origem</span>
                    <strong id="novoSaldoOrigem">R$ 0,00</strong>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <span class="card-subtitle">Saldo final no destino</span>
                    <strong id="novoSaldoDestino">R$ 0,00</strong>
                </div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn-close-custom w-100" data-close-modal>
                    Cancelar
                </button>

                <button type="submit" class="btn-purple-action w-100">
                    Adicionar Dinheiro
                </button>
            </div>
        </form>
    </div>
</div>
