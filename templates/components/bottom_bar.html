{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/bottom-bar.css') }}">
{% endblock %}


<nav class="bottom-bar">
  <div class="bottom-bar-container">
    <a href="/dashboard" class="nav-icon-btn {% if request.path.rstrip('/') == '/dashboard' %}active{% endif %}" title="Dashboard" {% if request.path.rstrip('/') == '/dashboard' %}aria-current="page"{% endif %}>
      <span><img src="{{ url_for('static', filename='img/icons/dashboard.svg') }}" alt="Dashboard"></span>
    </a>
    <a href="/contas" class="nav-icon-btn {% if request.path.rstrip('/') == '/contas' %}active{% endif %}" title="Contas Bancárias" {% if request.path.rstrip('/') == '/contas' %}aria-current="page"{% endif %}>
      <span><img src="{{ url_for('static', filename='img/icons/contas-bancarias.svg') }}" alt="Contas Bancárias"></span>
    </a>
    <a href="/categorias" class="nav-icon-btn {% if request.path.rstrip('/') == '/categorias' %}active{% endif %}" title="Categorias" {% if request.path.rstrip('/') == '/categorias' %}aria-current="page"{% endif %}>
      <span><img src="{{ url_for('static', filename='img/icons/categoria.svg') }}" alt="Categorias"></span>
    </a>
    <a href="/lancamento" class="nav-icon-btn {% if request.path.rstrip('/') == '/lancamento' %}active{% endif %}" title="Lançamentos" {% if request.path.rstrip('/') == '/lancamento' %}aria-current="page"{% endif %}>
      <span><img src="{{ url_for('static', filename='img/icons/lancamento.svg') }}" alt="Lançamentos"></span>
    </a>
    <a href="/reserva_emergencia" class="nav-icon-btn {% if request.path.rstrip('/') == '/reserva_emergencia' %}active{% endif %}" title="Reserva de Emergência" {% if request.path.rstrip('/') == '/reserva_emergencia' %}aria-current="page"{% endif %}>
      <span><img src="{{ url_for('static', filename='img/icons/reserva.svg') }}" alt="Reserva de Emergência"></span>
    </a>

    <div class="nav-icon-btn dropdown-trigger {% if request.path.rstrip('/') in ['/extrato', '/simulador', '/sequencia', '/perfil'] %}active{% endif %}" title="Configurações">
      <span><img src="{{ url_for('static', filename='img/icons/mais.svg') }}" alt="Configurações"></span>
      
      <div class="dropdown-menu">
        <a href="/extrato">Extrato</a>
        <a href="/simulador">Simulador de Patrimônio</a>
        <a href="/sequencia">Sequência</a>
        <a href="/perfil">Perfil</a>
        <button type="button" class="bottom-theme-switch" aria-label="Ativar tema claro" title="Ativar tema claro">
          <span class="theme-switch-label">Tema claro</span>
          <i class="bi bi-brightness-high-fill theme-switch-icon" aria-hidden="true"></i>
        </button>
        <a href="/logout" class="logout-btn" data-confirmar-logout>Sair</a>
      </div>
    </div>
    
  </div>
</nav>
