<div id="modalTransferirContas" class="duckfy-modal">
    <div class="dash-card modal-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="card-section-title m-0">Transferir dinheiro</h3>
            <button type="button" class="btn-close-custom" data-close-modal>&times;</button>
        </div>

        <form action="{{ url_for('transferir_dinheiro') }}" method="POST" id="formTransferirContas">
            <div class="mb-3">
                    <label for="contaOrigemTransferencia" class="card-subtitle d-block mb-1">
                    Conta de origem
                </label>

                <div class="input-icon-wrapper">
                    <select name="id_conta_origem" id="contaOrigemTransferencia" class="search-input" required>
                        <option value="" disabled selected>Selecione de onde retirar</option>

                        {% for conta in contas_bancarias %}
                        <option value="{{ conta.id_conta }}" data-saldo="{{ conta.saldo_atual }}"
                            data-reservado="{{ conta.valor_alocado|default(0, true) }}">
                            {{ conta.nome_conta }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="detalhes-saldo-conta" id="detalhesSaldoOrigem" aria-live="polite" hidden>
                    <span>Total <strong id="totalOrigem">R$ 0,00</strong></span>
                    <span>Na reserva <strong id="reservadoOrigem">R$ 0,00</strong></span>
                    <span>Disponível <strong id="disponivelOrigem">R$ 0,00</strong></span>
                </div>
            </div>

            <div class="d-flex justify-content-center align-items-center my-3">
                <button type="button" class="btn-alternar-contas" id="btnAlternarContas" title="Alternar contas"
                    aria-label="Alternar conta de origem e destino">
                    <img src="{{ url_for('static', filename='img/icons/alternar.svg') }}" alt=""
                        class="icon-alternar-contas">
                </button>
            </div>

            <div class="mb-3">
                    <label for="contaDestinoTransferencia" class="card-subtitle d-block mb-1">
                    Conta de destino
                </label>

                <div class="input-icon-wrapper">
                    <select name="id_conta_destino" id="contaDestinoTransferencia" class="search-input" required>
                        <option value="" disabled selected>Selecione para onde enviar</option>
                        {% for conta in contas_bancarias %}
                        <option value="{{ conta.id_conta }}" data-saldo="{{ conta.saldo_atual }}"
                            data-reservado="{{ conta.valor_alocado|default(0, true) }}">
                            {{ conta.nome_conta }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="detalhes-saldo-conta" id="detalhesSaldoDestino" aria-live="polite" hidden>
                    <span>Total <strong id="totalDestino">R$ 0,00</strong></span>
                    <span>Na reserva <strong id="reservadoDestino">R$ 0,00</strong></span>
                    <span>Disponível <strong id="disponivelDestino">R$ 0,00</strong></span>
                </div>
            </div>

            <div class="mb-3">
                    <label for="valorTransferenciaContas" class="card-subtitle d-block mb-1">
                    Valor da transferência (R$)
                </label>

                <div class="input-icon-wrapper">
                    <input type="text" name="valor" id="valorTransferenciaContas" class="search-input" placeholder="0,00"
                        inputmode="decimal" data-currency-input min="0.01" required>
                </div>
            </div>

            <p class="mensagem-validacao-conta" id="erroTransferenciaContas" role="alert" aria-live="assertive" hidden></p>

            <div class="resumo-saldo-conta mb-3" id="resumoTransferenciaContas" hidden aria-live="polite">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="card-subtitle">Disponível após transferir</span>
                    <strong id="disponivelFinalOrigem">R$ 0,00</strong>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="card-subtitle">Total após receber</span>
                    <strong id="saldoFinalDestino">R$ 0,00</strong>
                </div>
            </div>

            <p class="card-subtitle mb-3">
                A transferência movimenta o dinheiro entre suas contas e não aumenta nem diminui seu patrimônio total.
            </p>

            <div class="d-flex gap-2 mt-3">
                <button type="button" class="btn-close-custom w-100" data-close-modal>
                    Cancelar
                </button>

                <button type="submit" class="btn-purple-action w-100">
                    Transferir dinheiro
                </button>
            </div>
        </form>
    </div>
</div>
